[workspace]
resolver = "3"
members = [
  "crates/seiran",
  "crates/seiran-compiler",
  "crates/seiran-pdf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Seiran is a tool to generate PDF files from text files."
readme = "README.md"
repository = "https://github.com/Kumasan00/seiran"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
chrono = "0.4.45"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
figment2 = { version = "0.11.5", features = ["toml"] }
font-types = "0.12.1"
garde = { version = "0.23.0", features = ["derive"] }
harfrust = "0.13.0"
hayagriva = { version = "0.10.1", default-features = false, features = ["archive", "csl-json"] }
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "dutch", "english", "french", "german", "italian", "portuguese", "spanish"] }
icu = { version = "2.2.0", features = ["compiled_data"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
krilla = "0.8.2"
krilla-svg = "0.8.1"
lazy-regex = "3.6.0"
lopdf = { version = "0.44.0", default-features = false }
memchr = "2.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
phf = { version = "0.14.0", features = ["macros"] }
proptest = "1.11.0"
rayon = "1.12.0"
read-fonts = "0.43.0"
seiran-compiler = { path = "crates/seiran-compiler" }
seiran-pdf = { path = "crates/seiran-pdf" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
unic-langid = "0.9.6"
usvg = "0.47.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = 0 }

needless_return = { level = "allow", priority = 1 }
# 診断 enum は miette の位置情報（`NamedSource` + `SourceSpan`）を運ぶので必ず大きくなる。
# 「thiserror + miette の富んだ診断を採る」という種類の判断 1 個の帰結で、エラーはコールドパス。
result_large_err = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

# 抑制は「reason 付きの #[expect]」だけを許す。allow は抑制対象が消えても黙って残るが、
# expect なら rustc の unfulfilled_lint_expectations が失効した抑制を落とす。
allow_attributes = { level = "warn", priority = 2 }
absolute_paths = { level = "warn", priority = 2 }
allow_attributes_without_reason = { level = "warn", priority = 2 }
clone_on_ref_ptr = { level = "warn", priority = 2 }
implicit_return = { level = "warn", priority = 2 }
iter_over_hash_type = { level = "warn", priority = 2 }
map_err_ignore = { level = "warn", priority = 2 }
missing_assert_message = { level = "warn", priority = 2 }
missing_docs_in_private_items = { level = "warn", priority = 2 }
mod_module_files = { level = "warn", priority = 2 }
multiple_unsafe_ops_per_block = { level = "warn", priority = 2 }
panic_in_result_fn = { level = "warn", priority = 2 }
undocumented_unsafe_blocks = { level = "warn", priority = 2 }
unnecessary_safety_comment = { level = "warn", priority = 2 }
unused_result_ok = { level = "warn", priority = 2 }
# 本体の `.unwrap()` を禁じ、panic しない根拠を `.expect()` のメッセージへ書かせる
# （`unreachable!` / `missing_assert_message` と同じ「根拠を書かせる」形）。
# テスト内は clippy.toml の `allow-unwrap-in-tests` で対象外。
unwrap_used = { level = "warn", priority = 2 }

# nursery lint（上記の restriction lint とは別枠）。Known problems は false-negative
# （解析が保守的）で false-positive ではないため、発火したら真陽性として直す。
redundant_clone = { level = "warn", priority = 2 }

# nursery lint。「Eq を導出できるのに PartialEq だけ」を落とす。nursery なのは
# 「将来 float フィールドが増えうる型」「Eq の追加が公開 API の約束になる型」で
# 意図的に PartialEq 止まりにする選択があるためだが、seiran は Eq を導出できる型には
# 例外なく Eq を足す方針を採る（float を持つ型は lint が発火しないのでそのまま残る）。
derive_partial_eq_without_eq = { level = "warn", priority = 2 }

[workspace.lints.rust]
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
opt-level = 3
debug = false
# debug = true
strip = "symbols"
lto = true
codegen-units = 1
