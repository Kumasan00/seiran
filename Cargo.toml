[workspace]
resolver = "3"
members = [
  "crates/seiran",
  "crates/seiran-compiler",
  "crates/seiran-pdf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Seiran is a tool to generate PDF files from text files."
readme = "README.md"
repository = "https://github.com/Kumasan00/seiran"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
chrono = "0.4.45"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
figment2 = { version = "0.11.5", features = ["toml"] }
font-types = "0.12.1"
garde = { version = "0.23.0", features = ["derive"] }
harfrust = "0.13.0"
hayagriva = { version = "0.10.1", default-features = false, features = ["archive", "csl-json"] }
hypher = { version = "0.1.7", default-features = false, features = ["alloc", "dutch", "english", "french", "german", "italian", "portuguese", "spanish"] }
icu = { version = "2.2.0", features = ["compiled_data"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
krilla = "0.8.2"
krilla-svg = "0.8.1"
lopdf = { version = "0.44.0", default-features = false }
memchr = "2.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
phf = { version = "0.14.0", features = ["macros"] }
proptest = "1.11.0"
rayon = "1.12.0"
read-fonts = "0.43.0"
seiran-compiler = { path = "crates/seiran-compiler" }
seiran-pdf = { path = "crates/seiran-pdf" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time"] }
unic-langid = "0.9.6"
usvg = "0.47.0"

# lint の採用根拠の正典はここ（1 lint = 1 行の根拠コメント）。節見出しは選定の 6 軸で、
# CLAUDE.md「Clippy」節は原理と運用だけを持ちポインタでここを指す。
# group は priority -1、個別 lint は priority 既定（0）で group を上書きする。
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# 有効化しないもの（group が付ける warn を個別に落とす）
# ---------------------------------------------------------------------------

# 必須ルール 1「`return` を書く」の裏返し。
needless_return = "allow"
# 診断 enum は miette の位置情報を運ぶので必ず大きい（種類の判断 1 個の帰結・エラーはコールドパス）。
result_large_err = "allow"
# 組版コードの w/h・lhs/rhs は本質的に似た名前になる。
similar_names = "allow"
# 分割の判断基準は行数ではなく「自己完結した本体コードの塊」かどうか。
too_many_lines = "allow"

# ---------------------------------------------------------------------------
# A 規約の機械化 — prose の規約に対応する lint（最優先）
# ---------------------------------------------------------------------------

# use 規約の最終防衛線。`clippy.toml` の absolute-paths-max-segments = 3 で運用する。
absolute_paths = "warn"
# 抑制は `#[expect]` だけ（`allow` は抑制対象が消えても黙って残る）。
allow_attributes = "warn"
# 抑制には「なぜ許してよいか」の reason を必ず書かせる。
allow_attributes_without_reason = "warn"
# 「名前側を変えて衝突自体を無くす」（`ConfigValidationError` / `StyleValidationError`）の機械化。
error_impl_error = "warn"
# 必須ルール 1「`return` キーワード必須」。
implicit_return = "warn"
# assert には条件の言い換えでなく「なぜ成り立つはずか」を書かせる。
missing_assert_message = "warn"
# 必須ルール 4「doc コメントは全項目」の非公開側（公開側は rust の missing_docs）。
missing_docs_in_private_items = "warn"
# 「mod.rs を使わない」モジュール構成規約。
mod_module_files = "warn"
# SAFETY 族 — unsafe 操作 1 つに 1 ブロック 1 コメントの 1 対 1 対応を保つ。
multiple_unsafe_ops_per_block = "warn"
# 返り値の型で失敗を広告した関数の中で落ちない（診断エラーにして Err で返す）。
panic_in_result_fn = "warn"
# 表示はプロダクト。ライブラリ 2 crate の防火壁で、CLI の crate root だけ `#![expect]` で開ける。
print_stderr = "warn"
print_stdout = "warn"
# SAFETY 族 — `unsafe {}` の直上に `// SAFETY:` を書かせる。
undocumented_unsafe_blocks = "warn"
# SAFETY 族 — unsafe を含まない箇所の SAFETY コメントは誤読を招く死んだ注釈。
unnecessary_safety_comment = "warn"
# SAFETY 族 — unsafe を含まない項目に `# Safety` doc を書かせない。
unnecessary_safety_doc = "warn"
# 本体の `.unwrap()` を禁じ、panic しない根拠を `.expect()` のメッセージへ書かせる。
unwrap_used = "warn"

# ---------------------------------------------------------------------------
# B 字面に意味 — G1「字面だけで構造が一意」のコードへの適用
# ---------------------------------------------------------------------------

# `Rc::clone(&x)` 形で「参照カウントを増やしただけ」を呼び出し箇所に出す。
clone_on_ref_ptr = "warn"
# `.get(i).unwrap()` ではなく添字か `?` で書き、失敗の扱いを字面に出す。
get_unwrap = "warn"
# `map_err(|_| ...)` で元のエラーを黙って捨てない（cause は `#[source]` へ包む）。
map_err_ignore = "warn"
# `Result` を `.ok()` で握り潰さない（捨てるなら `let _ = f();` と字面に出す）。
unused_result_ok = "warn"

# ---------------------------------------------------------------------------
# C 決定性 — 成果物のバイト再現性を壊すものを拒む
# ---------------------------------------------------------------------------

# 関数ポインタを数値へ落とすと ASLR 等で値が変わる。
fn_to_numeric_cast_any = "warn"
# 定数との float 比較は丸め方式に依存する（等価判定を書かない）。
float_cmp_const = "warn"
# `HashMap` / `HashSet` の `for` 反復順はプロセスごとに変わる（`BTreeMap` か sort 済み `Vec` を使う）。
iter_over_hash_type = "warn"
# 型に収まらない float リテラルは黙って丸められる。
lossy_float_literal = "warn"

# ---------------------------------------------------------------------------
# D 0 件予防 — 発火 0 件かつ規約整合。無料の再発防止
# ---------------------------------------------------------------------------

# `#[cfg(not(test))]` で本体だけの分岐を作らない（テストと本体で別のコードを走らせない）。
cfg_not_test = "warn"
# デバッグ残骸を残さない。
dbg_macro = "warn"
# ライブラリ 2 crate がプロセスを殺さない（終了コードの決定は CLI の責務）。
exit = "warn"
# 終わらないループは `loop {}` ではなく終了条件のある形で書く。
infinite_loop = "warn"
# `mem::forget` による資源リーク。
mem_forget = "warn"
# `Rc<Mutex<T>>` は単一スレッドでの排他という取り違え（`RefCell` を使う）。
rc_mutex = "warn"
# テスト名に `test_` 接頭辞を付けない（何を検証するかだけを書く）。
redundant_test_prefix = "warn"
# 継承元と同名の inherent method は呼び先が字面で決まらない。
same_name_method = "warn"
# `String + &str` ではなく `push_str` / `format!` で書く。
string_add = "warn"
# メタ文字を持たないパターンは素の文字列操作で書く（正規表現エンジンを引き込まない）。
trivial_regex = "warn"
# `Err(x)?` ではなく `return Err(x)` と書く（早期 return を字面に出す）。
try_err = "warn"
# `use foo::{self}` は `use foo` と書く。
unnecessary_self_imports = "warn"
# `todo!` / `unimplemented!` を残さない。
todo = "warn"
unimplemented = "warn"

# ---------------------------------------------------------------------------
# E 対立 pair の lock-in — 2 通り書ける形は現行スタイル側（0 件の側）を固定する
# ---------------------------------------------------------------------------

# `pub(self)` ではなく `pub(crate)` 等の短縮形に統一する。
pub_without_shorthand = "warn"
# ブロックのセミコロンは `{ ...; }` と内側に置く。
semicolon_inside_block = "warn"
# 数値リテラルの型サフィックスは `1u32` 形（`1_u32` 形と混在させない）。
separated_literal_suffix = "warn"

# ---------------------------------------------------------------------------
# F nursery 個別主義 — Known problems を確認した lint だけを 1 件ずつ採用する
# ---------------------------------------------------------------------------

# 一度も読まないコレクション＝書き忘れか死んだコード。
collection_is_never_read = "warn"
# `debug_assert!` 内の可変呼び出しは release で消え、挙動が構成依存になる。
debug_assert_with_mut_call = "warn"
# `Eq` を導出できる型に `PartialEq` だけを derive しない（部分等価という誤った主張を残さない）。
derive_partial_eq_without_eq = "warn"
# `From` 実装の中で panic しない（失敗しうる変換は `TryFrom` で型に出す）。
fallible_impl_from = "warn"
# `(1 + x).ln()` / `x.exp() - 1` / `x.powf(1.0 / 3.0)` を書いたことの通知。提案（`ln_1p` / `exp_m1` /
# `cbrt`）は桁落ちを避ける側なので採るのが既定だが、採否は下の suboptimal_flops と同じ規則で箇所ごとに決める。
imprecise_flops = "warn"
# 読むだけの `&mut` 引数を落とす（呼び出し側に不要な可変借用を要求しない）。
needless_pass_by_ref_mut = "warn"
# 絶対パスの `push` は元のパスを丸ごと捨てる（`ProjectPath` の組み立てで効く）。
path_buf_push_overwrite = "warn"
# 長さ 0 の `Vec` へ `read` して 0 バイトだけ読む取り違え。
read_zero_byte_vec = "warn"
# move すれば済む値の `clone()`。Known problems は false-negative 側なので発火は真陽性。
redundant_clone = "warn"
# float の `a * b + c` を書いたことの通知。`mul_add` は IEEE の単一丸めで `a * b + c` と同じく決定的なので、
# 採用の代償は移行時に値が一度動く（golden 再生成）ことと、非 FMA ターゲットでの libm fallback だけ。
# 発火したら箇所ごとに決める — 項を累積して精度が効くなら提案を採り、1 項で定数畳み込みや可読性が勝つなら
# 積へ名前を付けて式から乗算を外し（`HYPHEN_DEMERIT`）、どちらでもないなら `#[expect]` + 根拠を書く。
suboptimal_flops = "warn"
# `peekable()` にしたのに peek しない＝先読みの意図が消えた残骸。
unused_peekable = "warn"

# 節見出しは上の clippy テーブルと同じ 6 軸。カタログ（`rustc -W help` の allow-by-default 61 lint）
# 全数の処分記録は #421（採用 23 / 恒久不採用 / 見送り）。
[workspace.lints.rust]

# ---------------------------------------------------------------------------
# A 規約の機械化 — prose の規約に対応する lint（最優先）
# ---------------------------------------------------------------------------

# 公開型は `Debug` を持つ（利用側の `#[derive(Debug)]` が連鎖して失敗しないように）。
missing_debug_implementations = "warn"
# 必須ルール 4「doc コメントは全項目」の公開側。
missing_docs = "warn"
# facade 規約の裏面。公開シグネチャに現れるのに名指しできない型を落とす。
unnameable_types = "warn"
# 「モジュールは既定で非公開 + root ファサード」の機械化。
unreachable_pub = "warn"
# use 規約「最短パス」の機械化（`absolute_paths` が見ない短いパス側を押さえる）。
unused_qualifications = "warn"
# Edition 2024 の既定水準の固定。`unsafe fn` の本体でも `unsafe {}` を書かせる。
unsafe_op_in_unsafe_fn = "warn"

# ---------------------------------------------------------------------------
# B 字面に意味 — G1「字面だけで構造が一意」のコードへの適用
# ---------------------------------------------------------------------------

# `-1i32.pow(2)` は `-(1.pow(2))` と読む。優先順位を括弧で字面に出させる。
ambiguous_negative_literals = "warn"
# 借用を持つ型は `Foo<'_>` と書き、借用の存在を字面に出す。
elided_lifetimes_in_paths = "warn"
# 型推論で足りる `as` を落とす（「意味のある変換がある」という誤読を残さない）。
trivial_casts = "warn"

# ---------------------------------------------------------------------------
# D 0 件予防 — 発火 0 件かつ規約整合。無料の再発防止
# ---------------------------------------------------------------------------

# 将来 deprecated になる項目を使った時点で知る（`deprecated` の前倒し）。
deprecated_in_future = "warn"
# `#[macro_use] extern crate` はマクロを use 経由でない第 2 の経路で持ち込む（use 規約の裏面）。
macro_use_extern_crate = "warn"
# `macro_rules!` のメタ変数の取り違え。解析は不完全（取りこぼしあり）だが FP は実測 0 件。
meta_variable_misuse = "warn"
# 使っていないライフタイム引数の残骸。
redundant_lifetimes = "warn"
# 1 回しか使わないライフタイム引数（`'_` で足りる）。
single_use_lifetimes = "warn"
# 型が変わらない数値キャスト。
trivial_numeric_casts = "warn"
# `let x = ();` は式の書き間違いの合図（返り値のない関数を束縛している）。
unit_bindings = "warn"
# Edition 2018 以降 `extern crate` は不要（依存は `use` だけで引く）。
unused_extern_crates = "warn"
# 使っていないライフタイム宣言。
unused_lifetimes = "warn"
# 使われないマクロ規則＝死んだ分岐（`define_template!` の規則追加で効く）。
unused_macro_rules = "warn"

# ---------------------------------------------------------------------------
# E 対立 pair の lock-in — 2 通り書ける形は現行スタイル側（0 件の側）を固定する
# ---------------------------------------------------------------------------

# 推論できる `T: 'a` 境界は書かない側に固定する。
explicit_outlives_requirements = "warn"
# `impl Trait` の `use<...>` は既定と異なるときだけ書く（冗長な指定を残さない）。
impl_trait_redundant_captures = "warn"
# 識別子は ASCII に固定する（doc コメント・診断メッセージ・テストの assert 文言は日本語のまま）。
non_ascii_idents = "warn"
# `use a::{b}` ではなく `use a::b` と書く（`unnecessary_self_imports` と同族）。
unused_import_braces = "warn"

[profile.release]
opt-level = 3
debug = false
# debug = true
strip = "symbols"
lto = true
codegen-units = 1
