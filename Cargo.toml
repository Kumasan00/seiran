[workspace]
members = [
  "crates/cli",
  "crates/font",
  "crates/parser",
  # "crates/pdf_gen",
  "crates/read_config_file",
  "crates/seiran",
  "crates/types",
]
resolver = "3"

[workspace.metadata]
default-run = "app"

[workspace.package]
authors = ["Kuma"]
description = "Seiran is a tool to generate PDF files from text files."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Kumasan00/seiran"
version = "0.1.0"

[workspace.dependencies]
allsorts = "0.16.1"
clap = { version = "4.5.57", features = ["derive"] }
font-types = "0.11.0"
harfbuzz_rs = "2.0.1"
harfrust = "0.5.0"
heck = "0.5"
indexmap = "2.13.0"
lazy-regex = "3.5.1"
memchr = "2.7.6"
memmap2 = "0.9.9"
miette = { version = "7.6.0", features = ["fancy"] }
pdf-writer = "0.14.0"
phf = { version = "0.13.1", features = ["macros"] }
phf_codegen = "0.13.1"
proc-macro2 = "1.0"
quote = "1.0.44"
rayon = "1.11.0"
read-fonts = { version = "0.37.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
skrifa = "0.40.0"
syn = "2.0.114"
thiserror = "2.0.18"
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["local-time"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = { level = "warn", priority = 0 }
pedantic = { level = "warn", priority = 0 }
unwrap_used = { level = "warn", priority = 0 }

cast_possible_truncation = { level = "allow", priority = 1 }
needless_return = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3
strip = "symbols"
