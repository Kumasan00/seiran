[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/pdf_gen",
  "crates/seiran",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Seiran is a tool to generate PDF files from text files."
readme = "README.md"
repository = "https://github.com/Kumasan00/seiran"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
chrono = "0.4.45"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
figment2 = { version = "0.11.5", features = ["toml"] }
font-types = "0.12.1"
garde = { version = "0.23.0", features = ["derive"] }
harfrust = "0.12.0"
hayagriva = {
  version = "0.10.1",
  default-features = false,
  features = ["archive", "csl-json"]
}
hypher = {
  version = "0.1.7",
  default-features = false,
  features = [
    "alloc",
    "dutch",
    "english",
    "french",
    "german",
    "italian",
    "portuguese",
    "spanish"
  ]
}
icu = { version = "2.2.0", features = ["compiled_data"] }
image = {
  version = "0.25.10",
  default-features = false,
  features = ["jpeg", "png"]
}
krilla = "0.8.2"
krilla-svg = "0.8.1"
lazy-regex = "3.6.0"
lopdf = { version = "0.44.0", default-features = false }
memchr = "2.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
model = { path = "crates/model" }
pdf_gen = { path = "crates/pdf_gen" }
phf = { version = "0.14.0", features = ["macros"] }
proptest = "1.11.0"
rayon = "1.12.0"
read-fonts = "0.41.0"
seiran = { path = "crates/seiran" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = {
  version = "0.3.23",
  features = ["env-filter", "local-time"]
}
unic-langid = "0.9.6"
usvg = "0.47.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = 0 }

needless_return = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

implicit_return = { level = "warn", priority = 2 }
missing_docs_in_private_items = { level = "warn", priority = 2 }

[profile.release]
opt-level = 3
debug = false
# debug = true
strip = "symbols"
lto = true
codegen-units = 1
