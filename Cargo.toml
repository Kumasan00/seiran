[workspace]
resolver = "3"
members = [
  "crates/citation",
  "crates/document",
  "crates/font",
  "crates/hlist",
  "crates/layout",
  "crates/lowering",
  "crates/parser",
  "crates/pdf_gen",
  "crates/read_config",
  "crates/read_references",
  "crates/read_style",
  "crates/seiran",
  "crates/syntax",
  "crates/types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Seiran is a tool to generate PDF files from text files."
readme = "README.md"
repository = "https://github.com/Kumasan00/seiran"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bumpalo = { version = "3.20.3", features = ["collections"] }
chrono = "0.4.45"
ciborium = "0.2.2"
citation = { path = "crates/citation" }
clap = { version = "4.6.1", features = ["derive"] }
document = { path = "crates/document" }
figment2 = { version = "0.11.5", features = ["toml"] }
font = { path = "crates/font" }
font-types = "0.12.1"
garde = { version = "0.23.0", features = ["derive"] }
harfrust = "0.12.0"
hayagriva = {
  version = "0.10.1",
  default-features = false,
  features = ["archive", "csl-json"]
}
hlist = { path = "crates/hlist" }
hypher = {
  version = "0.1.7",
  default-features = false,
  features = ["alloc", "english", "german", "french", "spanish", "italian", "portuguese", "dutch"]
}
icu = { version = "2.2.0", features = ["compiled_data"] }
image = {
  version = "0.25.10",
  default-features = false,
  features = ["jpeg", "png"]
}
krilla = "0.8.2"
krilla-svg = "0.8.1"
layout = { path = "crates/layout" }
lazy-regex = "3.6.0"
lowering = { path = "crates/lowering" }
memchr = "2.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
parser = { path = "crates/parser" }
pdf_gen = { path = "crates/pdf_gen" }
phf = { version = "0.14.0", features = ["macros"] }
rayon = "1.12.0"
read_config = { path = "crates/read_config" }
read-fonts = "0.41.0"
read_references = { path = "crates/read_references" }
read_style = { path = "crates/read_style" }
seiran = { path = "crates/seiran" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
syntax = { path = "crates/syntax" }
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
types = { path = "crates/types" }
unic-langid = "0.9.6"
usvg = "0.47.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = 0 }

cast_possible_truncation = { level = "allow", priority = 1 }
needless_return = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

[profile.release]
opt-level = 3
debug = false
# debug = true
strip = "symbols"
lto = true
codegen-units = 1
