absolute-paths-max-segments = 3
allow-mixed-uninlined-format-args = false
allow-panic-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false
inherent-impl-lint-scope = "module"
module-item-order-groupings = [
  ["mod", ["extern_crate", "mod", "foreign_mod"]],
  ["use", ["use"]],
  ["items", ["macro", "global_asm", "static", "const", "ty_alias", "enum", "struct", "union", "trait", "trait_alias", "impl", "fn"]],
]
source-item-ordering = ["module"]
upper-case-acronyms-aggressive = true
