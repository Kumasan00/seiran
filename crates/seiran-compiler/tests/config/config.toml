# golden テスト用の固定 config（fixture）
#
# ユーザローカルの `config/config.toml`（gitignore 対象）から独立させた、テスト専用の設定。
# フォント・CSL 等のサードパーティ資産は `tools/fetch-test-assets.sh` が `vendor/` へ
# ピン留めハッシュ付きで取得したものを参照する（golden の座標はフォントのバイト列に依存するため）。
# パスはワークスペースルート基準（golden テストがカレントディレクトリをルートへ固定する）。
#
# `sources` はプレースホルダで、golden テストが入力ごとに差し替える。

references_path = "crates/seiran-compiler/tests/config/references.toml"
sources = ["tests/text/text.sei"]
style_path = "crates/seiran-compiler/tests/config/style.toml"

[document]
title = "test_document"
author = "テスト著者"
date = "2026-01-01"
language = "ja"
keywords = ["test", "seiran"]

[output]
name = "test_document"
output_dir = "target/"

[pdf]
height = "842mm"
width = "595mm"

[font_configs.serif]
direction = "left-to-right"
font_name = "STIXTwoText_serif"
font_path = "vendor/fonts/STIXTwoText[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 400.0 }]

[font_configs.serif_bold]
direction = "left-to-right"
font_name = "STIXTwoText_serif_bold"
font_path = "vendor/fonts/STIXTwoText[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 700.0 }]

[font_configs.serif_italic]
direction = "left-to-right"
font_name = "STIXTwoText_serif_italic"
font_path = "vendor/fonts/STIXTwoText-Italic[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 400.0 }]

[font_configs.serif_bold_italic]
direction = "left-to-right"
font_name = "STIXTwoText_serif_bold_italic"
font_path = "vendor/fonts/STIXTwoText-Italic[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 700.0 }]

[font_configs.sans_serif]
direction = "left-to-right"
font_name = "NotoSans"
font_path = "vendor/fonts/NotoSans[wdth,wght].ttf"
script = "latn"
variation_axes = [
  { name = "wdth", value = 100.0 },
  { name = "wght", value = 400.0 },
]

[font_configs.sans_serif_bold]
direction = "left-to-right"
font_name = "NotoSans_bold"
font_path = "vendor/fonts/NotoSans[wdth,wght].ttf"
script = "latn"
variation_axes = [
  { name = "wdth", value = 100.0 },
  { name = "wght", value = 700.0 },
]

[font_configs.sans_serif_italic]
direction = "left-to-right"
font_name = "NotoSans_italic"
font_path = "vendor/fonts/NotoSans-Italic[wdth,wght].ttf"
script = "latn"
variation_axes = [
  { name = "wdth", value = 100.0 },
  { name = "wght", value = 400.0 },
]

[font_configs.sans_serif_bold_italic]
direction = "left-to-right"
font_name = "NotoSans_bold_italic"
font_path = "vendor/fonts/NotoSans-Italic[wdth,wght].ttf"
script = "latn"
variation_axes = [
  { name = "wdth", value = 100.0 },
  { name = "wght", value = 700.0 },
]

[font_configs.monospace]
direction = "left-to-right"
font_name = "JetBrainsMono"
font_path = "vendor/fonts/JetBrainsMono[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 400.0 }]

[font_configs.monospace_bold]
direction = "left-to-right"
font_name = "JetBrainsMono_bold"
font_path = "vendor/fonts/JetBrainsMono[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 700.0 }]

[font_configs.monospace_italic]
direction = "left-to-right"
font_name = "JetBrainsMono_italic"
font_path = "vendor/fonts/JetBrainsMono-Italic[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 400.0 }]

[font_configs.monospace_bold_italic]
direction = "left-to-right"
font_name = "JetBrainsMono_bold_italic"
font_path = "vendor/fonts/JetBrainsMono-Italic[wght].ttf"
script = "latn"
variation_axes = [{ name = "wght", value = 700.0 }]

[font_configs.math]
direction = "left-to-right"
font_name = "STIXTwoMath"
font_path = "vendor/fonts/STIXTwoMath-Regular.ttf"
script = "math"

[font_configs.japanese_serif]
direction = "left-to-right"
features = [
  { tag = "kern", value = 1 },
  { tag = "liga", value = 1 },
  { tag = "plat", value = 1 },
]
font_name = "NotoSerifJP"
font_path = "vendor/fonts/NotoSerifJP[wght].ttf"
language = "JAN"
script = "kana"
variation_axes = [{ name = "wght", value = 400.0 }]

[font_configs.japanese_serif_bold]
direction = "left-to-right"
features = [
  { tag = "kern", value = 1 },
  { tag = "liga", value = 1 },
  { tag = "plat", value = 1 },
]
font_name = "NotoSerifJP_bold"
font_path = "vendor/fonts/NotoSerifJP[wght].ttf"
language = "JAN"
