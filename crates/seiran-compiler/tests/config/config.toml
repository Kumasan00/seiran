[font_configs.japanese_sans_serif]
direction = "left-to-right"
features = [
  { tag = "kern", value = 1 },
  { tag = "liga", value = 1 },
  { tag = "plat", value = 1 },
]
font_name = "NotoSansJP"
font_path = "vendor/fonts/NotoSansJP[wght].ttf"
language = "JAN"
script = "kana"
