[font_configs.japanese_sans_serif_bold]
direction = "left-to-right"
features = [
  { tag = "kern", value = 1 },
  { tag = "liga", value = 1 },
  { tag = "plat", value = 1 },
]
font_name = "NotoSansJP_bold"
font_path = "vendor/fonts/NotoSansJP[wght].ttf"
language = "JAN"
script = "kana"
variation_axes = [{ name = "wght", value = 700.0 }]

[font_configs.japanese_monospace]
direction = "left-to-right"
font_index = 0
font_name = "SourceHanCodeJP"
font_path = "vendor/fonts/SourceHanCodeJP.ttc"

[font_configs.japanese_monospace_bold]
direction = "left-to-right"
font_index = 10
font_name = "SourceHanCodeJP_bold"
font_path = "vendor/fonts/SourceHanCodeJP.ttc"
