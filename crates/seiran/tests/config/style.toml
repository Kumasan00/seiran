# golden テスト用の固定 style（fixture）
#
# ユーザローカルの `config/style.toml`（gitignore 対象）から独立させた、テスト専用のスタイル。
# ここを変更すると golden の座標が変わるので、変更時は `UPDATE_GOLDEN=1 cargo test -p seiran`
# で golden を再生成し、差分を確認してコミットすること。
#
# Seiran スタイル設定
#
# `Style::default()` は英語デフォルト（"Part {number}: {title}" / "Figure {number}: {title}" 等）を返す。
# このファイルでは日本語化したい項目や見た目を変えたい項目だけを上書きする。
# 不要な設定はコメントアウトまたは削除すれば、Rust 側のデフォルトが適用される。
#
# ----- スキーマの主要ルール -----
# - 長さ値: `"12pt"` または `"5mm"` の単位付き文字列で指定（素の数値は不可）
# - 色: `"#rrggbb"` の 16 進文字列のみ（大文字小文字不問）。配列 `[r, g, b]` は不可
# - 見出し: `default_for_level()` (Rust 既定) → `[heading]` base → `[heading.<level>]` の 3 レイヤーで重畳
# - キャプション: `[figure.caption]` / `[table.caption]` のテーブルに `format` / `font_size` を書く。
#   キャプションの上下位置（図・表とも）はソース上の `\caption` が本体より前か後かで決まり、
#   スタイル側では指定しない。
# - カウンタ: `[counters.<name>]` はカウンタ定義（`display_name` / `format` / `resets`）
# - 拡張領域: `footnote` / `toc` は現状
#   lowering/pdf_gen 未参照のため `[extended.*]` 配下にまとめている（資産として保持）
# - ハイパーリンク: `[hyperref]` はトップレベル（リンク色のみ）。しおり出力は config の [pdf].show_bookmarks
# - 参考文献: `[reference]` はトップレベル。`\cite` の CSL 整形（citation）が参照する
#   （CSL スタイル `csl_path` とロケール `locale_path` はともにここで指定する）

# ===== トップレベル =====

background_color = "#cc9966"  # 背景色を有効化（消すには行ごと削除）

# ===== 本文テキスト（[text] に集約） =====

# 本文の既定見た目（フォントサイズ・行高・段落間スペース・字下げ・書体）は [text] にまとめる。
[text]
# font_size = "12pt"          # 本文の既定フォントサイズ
line_height_factor = 1.05     # 行高（フォントサイズに対する倍率）
# paragraph_spacing = "12pt"
# first_line_indent = "0pt"
# font_kind = "serif"

# ===== 段組み（1 段 / 2 段切替） =====

# 本文を左段 → 右段 → 次ページの順に流す。前付け（タイトルページ・目次）は常に 1 段。
# count は 1（単段、既定）か 2。gap は段間（gutter）。段幅 = (本文幅 − (count−1)×gap) / count。
# （[math.block].column_gap は数式の `&` 列間隔で別物。混同しないこと）
[columns]
# count = 1                   # 段数（1 または 2）
# gap = "18pt"                # 段間（gutter）

# ===== 見出し（レベル別差分のみ） =====

# Rust 既定（Part: 40pt 改ページあり、Section: 20pt …）に対し、`[heading.<level>]` テーブルで
# 差分を上書きする。`[heading]` 直下にスカラーを書くことはできない。

[heading.part]
format = "第{number}部 {title}"

[heading.chapter]
format = "第{number}章 {title}"

[heading.section]
format = "{number} {title}"

# heading.subsection / heading.paragraph / heading.subparagraph はデフォルト
# （"{number} {title}"）を使用

# ===== リスト =====

# [list]
# indent = "20pt"
# item_margin_bottom = "4pt"
# unordered_marker = "•"
# ordered_marker_format = "{number}."
# marker_font_kind = "serif"

# ===== 数式：スクリプト（上付き / 下付きのレイアウト） =====

# 将来的に OpenType MATH テーブルから自動取得する予定（現状は手動指定）。
# インライン数式（$...$）にも効く。
# [math.script]
# script_size_factor = 0.7
# superscript_raise_factor = 0.4
# subscript_drop_factor = 0.2
# min_script_font_size = "6pt"

# ===== 表（実装済みの core 領域） =====

# キャプション位置はソース上の `\caption` の出現位置で決まる
# （本体より前なら上、後なら下）。スタイル側では指定しない。
# [table]
# top_margin = "12pt"
# bottom_margin = "12pt"
# inner_margin = "6pt"                 # 表本体とキャプションの間隔
# rule_thickness = "0.5pt"
# rule_color = "#000000"              # 省略時は黒

# [table.caption]
# format = "表{number}: {title}"
# font_size = "11pt"

# ===== カウンタ定義 =====

# `[counters.<name>]` の <name> は固定 9 種（part / chapter / section / subsection /
# paragraph / subparagraph / table / figure / equation）のみ。各カウンタは次を持つ:
#   display_name  表示名（"Figure" / "図" など）。ref_format の {display_name} から参照
#   format        番号テンプレート。{n} で自身、{<counter>} で他カウンタの値を埋め込む
#                 （例 "{n}" / "{chapter}.{n}" / "第{n}章"）
#   number_style  数字表記（"arabic" / "roman_upper" / "roman_lower" など）
#   ref_format    \ref{label} の表示テンプレート。{number} で format の出力、{display_name} で
#                 種別名を埋め込む（例 "{display_name} {number}" → "Figure 1.2"）
#   resets        このカウンタが進んだとき 0 に戻す下位カウンタ群
# 書いたフィールドだけが上書きされ、省略したカウンタ・フィールドは既定値を保つ。
#
# カウンタ定義の例: 図番号の \ref を「図 1.2」にする
# [counters.figure]
# display_name = "図"
# ref_format = "{display_name} {number}"

# ===== 図（実装済みの core 領域） =====

# キャプション位置はソース上の `\caption` の出現位置で決まる
# （本体より前なら上、後なら下）。スタイル側では指定しない。
# 画像のダウンサンプリング（max_dpi / downsample）は出力物理のため config.toml の [image] に移動した（#125）。
# [figure]
# top_margin = "12pt"
# bottom_margin = "12pt"
# inner_margin = "6pt"
# [figure.caption]
# format = "図{number}: {title}"
# font_size = "11pt"

# ===== 数式：ブロック（ディスプレイ数式のレイアウト） =====

# equation / align / gather / split / multiline / cases / matrix の全表示数式環境が共有する。
# 数式番号の見た目は 3 系統が別々に決める:
#   math.block.tag_format         式の横に出すタグ（tag）。figure の caption.format に相当する
#                                 「数式ブロックの体裁」。許可トークンは {number} のみ
#   counters.equation.number_format  番号そのものの構築（number）。{n} で自身、{chapter} 等で他カウンタ
#   counters.equation.ref_format  \ref{eq:x} の表示（ref）。許可トークンは {number} / {display_name}
# tag と ref の既定はどちらも "({number})"（→ "(1.1)"）。一致しているのは LaTeX 慣習で「式の横」も
# 「素の相互参照」もともに括弧付き番号だから、というだけで両者は独立。揃えたいなら両方を直す
# （例: 横は tag_format = "({number})"、参照は ref_format = "式 {number}" → "式 1.1"）。
# [math.block]
# tag_format = "({number})"
# number_side = "right"               # "right" / "left"
# alignment = "center"                # "center" / "left" / "right"
# row_gap = "3pt"                     # 行間（複数行環境のベースライン間の追加アキ）
# column_gap = "6pt"                  # 列間（& で分割した列の間隔）
# top_margin = "8pt"
# bottom_margin = "8pt"

# ===== 定理環境（theorem / lemma / proof … 10 種） =====

# 固定 10 種の定理クラス（theorem / lemma / proposition / corollary / definition /
# axiom / example / remark / claim / proof）を `[theorems.<class>]` で上書きする。
# 見出しと同じ 2 レイヤーマージ（Rust 既定 → クラス別差分）で、書いたフィールドだけ上書きされる。
# 未知のクラス名・未知のフィールド名は拒否される。display_name の既定は英語。
#
#   display_name  表示名（"定理" / "Theorem" など）。見出しの {display_name} から参照
#   counter       共有カウンタ名。同名を指定したクラスは 1 つのカウンタを共有する
#   reset_by      カウンタのリセット先: "part" / "chapter" / "section" / "subsection" / "none"
#   format        番号テンプレート（counter と同形。"{n}" / "{chapter}.{n}" など）
#   unnumbered    採番しないか（proof は既定 true）
#   qed_mark      証明末尾の QED 記号（proof は既定 "□"）
#   [theorems.<class>.style] サブテーブル:
#     heading_format             サブタイトルなしの見出し書式（{display_name} {number}）
#     heading_with_title         サブタイトルありの見出し書式（{display_name} {number} ({title})）
#     heading_with_of            proof の of ありの見出し書式（{display_name} of {of}）。{of} は
#                                証明対象の参照文字列（「Theorem 1」等）。前置語「of」もここで上書き可
#     heading_with_of_and_title  proof の of・title 併用時の見出し書式（{display_name} of {of} ({title})）
#     font_kind           本文の書体（定理系は既定 serif_italic、定義系・証明は serif）
#     heading_font_kind   見出しの書体（既定 serif_bold）
#     top_margin / bottom_margin  ブロックの上下余白（既定 12pt）

# [theorems.theorem]
# display_name = "定理"
# counter = "theorem"
# reset_by = "chapter"
# format = "{chapter}.{n}"
# [theorems.theorem.style]
# font_kind = "serif_italic"
# heading_font_kind = "serif_bold"

# [theorems.lemma]
# display_name = "補題"
# counter = "theorem"                 # theorem とカウンタを共有

# [theorems.proof]
# display_name = "証明"
# unnumbered = true
# qed_mark = "∎"

# ===== ヘッダー・フッター（ページ上端／下端の走り文） =====

# 左・中央・右の 3 スロット。各スロットのテンプレートには静的テキストに加えて
# 次のトークンを埋め込める（実値は config.toml のメタデータとページ番号から注入される）:
#   {page}   現在のページ番号（1 始まり）
#   {pages}  総ページ数
#   {title}  config.toml [document] の title
#   {author} config.toml [document] の author
#   {date}   config.toml [document] の date
# 既定では全スロット空のため何も描画されない（書いたスロットだけ出る）。
# baseline_offset はヘッダーがページ上端から、フッターがページ下端からベースラインまでの距離。
# rule_thickness を 0pt より大きくすると区切り線を描く（rule_color 省略時は黒）。

# [header]
# left   = "{title}"
# right  = "{page} / {pages}"
# font_size = "10pt"
# font_kind = "serif"                 # snake_case（serif / sans_serif / monospace …）
# baseline_offset = "15mm"
# rule_thickness = "0.5pt"
# rule_gap = "2pt"                    # テキストと区切り線の間隔
# rule_color = "#888888"

# [footer]
# center = "{page}"
# font_size = "10pt"
# baseline_offset = "15mm"

# ===== タイトルページ（\maketitle 相当） =====

# enabled = true で文書の先頭に自動生成のタイトルページが挿入され、本文は次ページから始まる。
# 内容は config.toml [document] の title / author / date から取得し、中央寄せで配置する
# （ソース側にコマンドは書かない）。タイトルページにはヘッダー・フッターを描画しない。
# 既定は無効（enabled = false）。各フォントサイズ・種別・要素間の縦アキを下で制御できる。

# [title_page]
# enabled = true
# top_margin = "120pt"                  # ページ上端からタイトルまでの送り（垂直位置の簡易指定）
# title_font_size = "36pt"
# title_font_kind = "serif_bold"        # snake_case（serif / serif_bold / sans_serif …）
# title_bottom_margin = "24pt"          # タイトルと著者の間隔
# author_font_size = "18pt"
# author_font_kind = "serif"
# author_bottom_margin = "12pt"         # 著者と日付の間隔
# date_font_size = "14pt"
# date_font_kind = "serif"

# ===== 拡張領域（lowering/pdf_gen 未参照、資産として保持） =====

# [extended.footnote]
# font_size = "9pt"
# line_height_factor = 1.1
# separator_width = "80pt"
# separator_thickness = "0.5pt"
# top_margin = "8pt"
# marker_format = "*{number}"

# [extended.toc]
# title = "目次"
# max_depth = 3
# font_size = "12pt"
# bottom_margin = "10pt"
# show_page_numbers = true

# [hyperref]
# link_color = "#0000ff"
# url_color = "#0000ff"
# cite_color = "#0000ff"
# しおり（ブックマーク）の出力可否は config.toml の [pdf].show_bookmarks に移動した（#127）

[reference]
csl_path = "vendor/csl/ieee.csl"  # CSL スタイル（.csl）。採番方式・書誌の体裁を定める
locale_path = "vendor/csl/locales-ja-JP.xml"
locale = "ja-JP"
# title = "参考文献"                  # 参考文献セクションの見出し文字列
# font_size = "12pt"                  # セクションのフォントサイズ
# bottom_margin = "10pt"              # セクションブロックの下余白
# locale_path = "locales/locales-ja-JP.xml"   # CSL ロケール XML で内蔵ロケールを上書き・補強
#                                     # （有効ロケールと同一言語コードなら優先）

# [toc]
# enabled = true
