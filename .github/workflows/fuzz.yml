name: Fuzz

# frontend の coverage-guided fuzz を手動・週次で回す（全 PR の必須チェックにはしない）。
# 実行フラグと資源予算は tools/fuzz-frontend.sh 1 箇所が持ち、手順は fuzz/README.md。
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "探索する秒数（-max_total_time）"
        required: false
        default: "900"
  push:
    branches: [test/frontend-fuzzing]
  schedule:
    # 日曜 03:00 JST
    - cron: "0 18 * * 6"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Fuzz frontend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        # 配布バイナリ（musl 版）だと cargo-fuzz が既定の --target を musl にし、ASan が静的 libc を拒否するので
        # 実行環境（gnu）でビルドして入れる
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/frontend
          key: fuzz-corpus-frontend-${{ github.run_id }}
          restore-keys: fuzz-corpus-frontend-
      - name: Run fuzz
        shell: bash
        env:
          # schedule には inputs が無いので既定へ落ちる（`SECONDS` は bash の特殊変数なので使わない）
          FUZZ_SECONDS: ${{ inputs.seconds || (github.event_name == 'push' && '120') || '1800' }}
        run: tools/fuzz-frontend.sh "$FUZZ_SECONDS" 2>&1 | tee fuzz-frontend.log
      - name: Save corpus
        # 素の actions/cache は成功時しか保存しないので、クラッシュを見つけた回の corpus も残すよう分ける
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/frontend
          key: fuzz-corpus-frontend-${{ github.run_id }}
      - name: Summarize outcomes
        if: always()
        run: |
          {
            echo '## corpus の到達段'
            echo '```'
            cargo +nightly run -p seiran-fuzz --example corpus_stats -- fuzz/corpus/frontend
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/frontend
          if-no-files-found: ignore
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-log
          path: fuzz-frontend.log
          if-no-files-found: ignore
