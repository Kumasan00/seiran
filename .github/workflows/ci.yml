name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
  test:
    name: Test and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache test assets
        uses: actions/cache@v6
        with:
          path: vendor
          key: test-assets-${{ hashFiles('tools/fetch-test-assets.sh') }}
      - name: Fetch test assets
        run: tools/fetch-test-assets.sh
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        # cargo lint（`[workspace.lints.cargo]`）は rustc の -D warnings で落ちないので cargo 側の warnings を deny にする
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run clippy on the fuzz crate
        # seiran-fuzz は default-members 外なので上の clippy に入らない。lint だけを PR で回す（fuzz の実行は fuzz.yml）
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo clippy -p seiran-fuzz --all-targets -- -D warnings
      - name: Run tests
        # 未承認のスナップショット差分・欠落は失敗させ、候補を .snap.new に書く（自動承認・force-pass にしない）
        env:
          INSTA_UPDATE: new
          INSTA_FORCE_PASS: "0"
        run: cargo test --all-features
      - name: Upload pending snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: insta-pending-snapshots
          path: "**/*.snap.new"
          if-no-files-found: ignore
      - name: Run cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --all-features
      - name: Build release
        if: github.event_name == 'push'
        run: cargo build --release
