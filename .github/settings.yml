# GitHub リポジトリ設定の単一ソース（反映には Probot "Settings" App が必要: https://github.com/apps/settings）。
# default ブランチ(main)のこのファイルを更新すると App が設定を同期する。ここに無いキーは触らない。
# ブランチ保護 ruleset は Settings App が更新に未対応のため、ファイル管理から除外し GitHub 上で手動管理する。
repository:
  name: seiran
  description: TeX スタイルのテキストファイルから高品質な PDF を生成する Rust 製 CLI 組版ツール

  # マージは squash 一本（merge / rebase commit は無効）。main を 1 PR = 1 コミットの linear に保つ。
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

  # squash の件名 = PR タイトル、本文 = PR 本文（PR テンプレの内容がそのまま履歴になる）。
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

  # CI 通過後の自動マージを許可。PR の "Update branch"（main 追従）ボタンも有効化。
  allow_auto_merge: true
  allow_update_branch: true

  # マージ済みブランチを自動削除。
  delete_branch_on_merge: true

  # issue / Pull requests を有効化（運用の根幹）。未使用の Wiki / Projects タブは無効化。
  has_issues: true
  has_pull_requests: true
  pull_request_creation_policy: all
  has_wiki: false
  has_projects: false

# ラベルの単一ソース。repository: と違い labels: は「このリストが正本」で、
# ここに無いラベルは同期時に App が削除する（運用方針は CLAUDE.md「ラベル運用」を参照）。
labels:
  # 種別
  - name: enhancement
    color: 'a2eeef'
    description: New feature or request
  - name: bug
    color: 'd73a4a'
    description: Something isn't working
  - name: documentation
    color: '0075ca'
    description: Improvements or additions to documentation

  # Tier（seiran_feature_scope の実装順序軸）
  - name: tier-1a
    color: '0e8a16'
    description: 'Tier 1a: 既存スタブ完成+全ジャンル必須'
  - name: tier-1b
    color: 'fbca04'
    description: 'Tier 1b: コア拡張'
  - name: tier-1c
    color: 'd93f0b'
    description: 'Tier 1c: 標準機能'
  - name: tier-2
    color: 'cccccc'
    description: 'Tier 2: 将来検討'

  # 構造
  - name: epic
    color: '5319e7'
    description: 親 issue（sub-issue に分割）

  # Dependabot が自動付与（運用上は放置）
  - name: dependencies
    color: '6b5049'
  - name: rust
    color: '78ef4a'
  - name: github-actions
    color: '66b6f4'
