# GitHub リポジトリ設定の単一ソース（反映には Probot "Settings" App が必要: https://github.com/apps/settings）。
# default ブランチ(main)のこのファイルを更新すると App が設定を同期する。ここに無いキーは触らない。
# ブランチ保護 ruleset は Settings App が更新に未対応のため、ファイル管理から除外し GitHub 上で手動管理する。
repository:
  name: seiran
  description: TeX スタイルのテキストファイルから高品質な PDF を生成する Rust 製 CLI 組版ツール

  # マージは squash 一本（merge / rebase commit は無効）。main を 1 PR = 1 コミットの linear に保つ。
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false

  # squash の件名 = PR タイトル、本文 = PR 本文（PR テンプレの内容がそのまま履歴になる）。
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

  # CI 通過後の自動マージを許可。PR の "Update branch"（main 追従）ボタンも有効化。
  allow_auto_merge: true
  allow_update_branch: true

  # マージ済みブランチを自動削除。
  delete_branch_on_merge: true

  # issue / Pull requests を有効化（運用の根幹）。未使用の Wiki / Projects タブは無効化。
  has_issues: true
  has_pull_requests: true
  pull_request_creation_policy: all
  has_wiki: false
  has_projects: false
